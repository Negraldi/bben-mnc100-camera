# AR0330 camera stack for the BBEN MNC100: atomisp ISP (staging, 6.12 tree from
# EasyNetDev/atomisp-6.10-dkms, fetched by install.sh), its gmin platform layer, and the
# multi-mode AR0330 driver generated from the Windows ar0330.sys tables.
PACKAGE_NAME="atomisp-bben"
PACKAGE_VERSION="1.0"
MAKE[0]="bash ./dkms-build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf out"
BUILT_MODULE_NAME[0]="atomisp"
BUILT_MODULE_LOCATION[0]="out/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="atomisp_gmin_platform"
BUILT_MODULE_LOCATION[1]="out/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="atomisp-ar0330"
BUILT_MODULE_LOCATION[2]="out/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
# Never built from the kernel postinst hook: a failed DKMS build there aborts run-parts
# before initramfs-tools and update-grub. atomisp-camera.service builds it at boot instead.
AUTOINSTALL="no"
# The vendored atomisp tree only covers 6.12.
BUILD_EXCLUSIVE_KERNEL="^6\.12\."
